name: Deploy Notifier Lambda

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install git
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      # Setup AWS CLI
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-1

      # Build the application FIRST (outside Docker for better reliability)
      - name: Build with Maven
        env:
          MY_GITHUB_USERNAME: ${{ secrets.MY_GITHUB_USERNAME }}
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          echo "📦 Building application with Maven..."
          mvn --no-transfer-progress --settings settings.xml clean package \
            -DskipTests \
            -Dquarkus.package.type=uber-jar

      # Login to ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-south-1 | docker login --username AWS --password-stdin 435703062953.dkr.ecr.eu-south-1.amazonaws.com

      

      # Try Lambda-optimized Dockerfile first, fallback to multi-stage
      - name: Build and push Docker image
        run: |
          echo "🐳 Attempting Lambda-optimized build first..."
          
          # Try the Lambda-optimized Dockerfile first
          if docker build \
            --platform linux/amd64 \
            --tag 435703062953.dkr.ecr.eu-south-1.amazonaws.com/notificamy:latest \
            -f Dockerfile.lambda-optimized \
            .; then
            echo "✅ Lambda-optimized build successful"
          else
            echo "⚠️ Lambda-optimized build failed, trying multi-stage build..."
            docker build \
              --platform linux/amd64 \
              --tag 435703062953.dkr.ecr.eu-south-1.amazonaws.com/notificamy:latest \
              --build-arg MY_GITHUB_USERNAME=${{ secrets.MY_GITHUB_USERNAME }} \
              --build-arg MY_GITHUB_TOKEN=${{ secrets.MY_GITHUB_TOKEN }} \
              .
          fi
          
          echo "📤 Pushing image to ECR..."
          docker push 435703062953.dkr.ecr.eu-south-1.amazonaws.com/notificamy:latest
