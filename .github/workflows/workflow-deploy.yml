
name: Deploy Notifier Lambda

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # Setup AWS CLI
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-1

      # Login a ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-south-1 | docker login --username AWS --password-stdin 435703062953.dkr.ecr.eu-south-1.amazonaws.com
      - name: Build with Maven
        env:
          MY_GITHUB_USERNAME: ${{ secrets.MY_GITHUB_USERNAME }}
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: mvn --no-transfer-progress --settings settings.xml install dependency:copy-dependencies -DincludeScope=runtime -U

      - name: Set Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name NotificamyNotifierLambda \
            --environment "Variables={
              DB_URL=${{ secrets.DB_URL }},
              DB_USER=${{ secrets.DB_USER }},
              DB_PASSWORD=${{ secrets.DB_PASSWORD }},
              AWS_SQS_QUEUE_URL=${{ secrets.AWS_SQS_QUEUE_URL }}}"

      # Build dell'immagine Docker
      - name: Build Docker image
        run: |
          docker build -t notificamy .

      # Tag dell'immagine Docker
      - name: Tag Docker image
        run: |
          docker tag notificamy:latest 435703062953.dkr.ecr.eu-south-1.amazonaws.com/notificamy:latest

      # Push dell'immagine a ECR
      - name: Push Docker image to Amazon ECR
        run: |
          docker push 435703062953.dkr.ecr.eu-south-1.amazonaws.com/notificamy:latest

      # Aggiorna la funzione Lambda
      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name NotificamyNotifierLambda \
            --image-uri 435703062953.dkr.ecr.eu-south-1.amazonaws.com/notificamy:latest
