name: Deploy Notifier Lambda

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install git
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      # Setup AWS CLI
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-1

      # Build the application FIRST (outside Docker for better reliability)
      - name: Build with Maven
        env:
          MY_GITHUB_USERNAME: ${{ secrets.MY_GITHUB_USERNAME }}
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          echo "📦 Building application with Maven..."
          mvn --no-transfer-progress --settings settings.xml clean package \
            -DskipTests \
            -Dquarkus.package.type=uber-jar

      # Verify JAR was created
      - name: Verify JAR file
        run: |
          echo "📋 Verifying JAR file..."
          ls -la target/
          if [ ! -f target/lambda-processor-1.0.0-SNAPSHOT-runner.jar ]; then
            echo "❌ JAR file not found!"
            exit 1
          fi
          echo "✅ JAR file created: $(ls -lh target/lambda-processor-1.0.0-SNAPSHOT-runner.jar)"

      # Create ECR repository if it doesn't exist
      - name: Create ECR repository
        run: |
          aws ecr describe-repositories --repository-names notificamy --region eu-south-1 || \
          aws ecr create-repository --repository-name notificamy --region eu-south-1

      # Login to ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-south-1 | docker login --username AWS --password-stdin 435703062953.dkr.ecr.eu-south-1.amazonaws.com

      # Delete existing Lambda function to force recreation
      - name: Delete existing Lambda function
        run: |
          if aws lambda get-function --function-name NotificamyNotifierLambda --region eu-south-1 >/dev/null 2>&1; then
            echo "🗑️ Deleting existing Lambda function to force recreation..."
            aws lambda delete-function \
              --function-name NotificamyNotifierLambda \
              --region eu-south-1
          
            # Wait for deletion to complete
            echo "⏳ Waiting for function deletion..."
            sleep 30
          else
            echo "ℹ️ Lambda function doesn't exist, will create new one"
          fi

      # Try Lambda-optimized Dockerfile first, fallback to multi-stage
      - name: Build and push Docker image
        run: |
          echo "🐳 Attempting Lambda-optimized build first..."
          
          # Try the Lambda-optimized Dockerfile first
          if docker build \
            --platform linux/amd64 \
            --tag 435703062953.dkr.ecr.eu-south-1.amazonaws.com/notificamy:latest \
            -f Dockerfile.lambda-optimized \
            .; then
            echo "✅ Lambda-optimized build successful"
          else
            echo "⚠️ Lambda-optimized build failed, trying multi-stage build..."
            docker build \
              --platform linux/amd64 \
              --tag 435703062953.dkr.ecr.eu-south-1.amazonaws.com/notificamy:latest \
              --build-arg MY_GITHUB_USERNAME=${{ secrets.MY_GITHUB_USERNAME }} \
              --build-arg MY_GITHUB_TOKEN=${{ secrets.MY_GITHUB_TOKEN }} \
              .
          fi
          
          echo "📤 Pushing image to ECR..."
          docker push 435703062953.dkr.ecr.eu-south-1.amazonaws.com/notificamy:latest

      # Verify image was pushed successfully
      - name: Verify ECR image
        run: |
          echo "📋 Verifying pushed image..."
          aws ecr describe-images \
            --repository-name notificamy \
            --region eu-south-1 \
            --query 'imageDetails[0].[imageTags[0],imagePushedAt,imageSizeInBytes,imageManifestMediaType]' \
            --output table

      # Wait for ECR to fully process the image
      - name: Wait for ECR processing
        run: |
          echo "⏳ Waiting for ECR to process image..."
          sleep 15

      # Create new Lambda function
      - name: Create Lambda function
        run: |
          echo "📦 Creating new Lambda function..."
          aws lambda create-function \
            --function-name NotificamyNotifierLambda \
            --package-type Image \
            --code ImageUri=435703062953.dkr.ecr.eu-south-1.amazonaws.com/notificamy:latest \
            --role arn:aws:iam::435703062953:role/lambda-execution-role \
            --architectures x86_64 \
            --timeout 300 \
            --memory-size 1024 \
            --region eu-south-1 \
            --description "Notificamy notification processor with multi-channel support" \
            --environment "Variables={
              DATABASE_SECRET_NAME='${{ secrets.DATABASE_SECRET_NAME }}',
              API_KEYS_SECRET_NAME='${{ secrets.API_KEYS_SECRET_NAME }}',
              NOTIFICAMY_AWS_REGION='eu-south-1',
              AWS_SQS_QUEUE_URL='${{ secrets.AWS_SQS_QUEUE_URL }}',
              AWS_SES_FROM_EMAIL='${{ secrets.AWS_SES_FROM_EMAIL }}',
              AWS_SES_FROM_NAME='${{ secrets.AWS_SES_FROM_NAME }}',
              WHATSAPP_API_URL='${{ secrets.WHATSAPP_API_URL }}',
              OPENAI_API_URL='https://api.openai.com/v1/chat/completions'
            }"

      # Wait for function to be active
      - name: Wait for Lambda function
        run: |
          echo "⏳ Waiting for Lambda function to be active..."
          aws lambda wait function-active \
            --function-name NotificamyNotifierLambda \
            --region eu-south-1

      # Verify deployment
      - name: Verify Lambda function
        run: |
          echo "✅ Deployment completed! Function details:"
          aws lambda get-function \
            --function-name NotificamyNotifierLambda \
            --region eu-south-1 \
            --query 'Configuration.[FunctionName,State,LastUpdateStatus,PackageType,Architectures,CodeSha256,Runtime]' \
            --output table
          
          echo "📋 Environment variables:"
          aws lambda get-function-configuration \
            --function-name NotificamyNotifierLambda \
            --region eu-south-1 \
            --query 'Environment.Variables' \
            --output table

      # Test the function
      - name: Test Lambda function
        run: |
          echo "🧪 Testing Lambda function..."
          aws lambda invoke \
            --function-name NotificamyNotifierLambda \
            --region eu-south-1 \
            --payload '{"Records":[{"body":"{\"query_id\":1,\"prompt\":\"Test message\",\"user_email\":\"test@example.com\"}"}]}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          
          echo "📋 Lambda response:"
          cat response.json