# Database configuration
quarkus:
  datasource:
    db-kind: mysql
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    jdbc:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notifyme}
      max-size: 16

  hibernate-orm:
    database:
      generation: none
    log:
      sql: ${QUARKUS_LOG_SQL:false}

  # AWS Configuration
  sqs:
    endpoint-override: ${AWS_SQS_ENDPOINT:}
    aws:
      region: ${AWS_REGION:us-east-1}
      credentials:
        type: default

  ses:
    endpoint-override: ${AWS_SES_ENDPOINT:}
    aws:
      region: ${AWS_REGION:us-east-1}
      credentials:
        type: default

  # Lambda configuration
  lambda:
    handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler

# Application configuration
app:
  openai:
    api-key: ${OPENAI_API_KEY}
    api-url: ${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
  
  aws:
    sqs:
      queue-url: ${AWS_SQS_QUEUE_URL:}
    ses:
      from-email: ${AWS_SES_FROM_EMAIL:service@notifyme.com}
      from-name: ${AWS_SES_FROM_NAME:Notificamy service}
  
  # WhatsApp Configuration (using WhatsApp Business API)
  whatsapp:
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0/YOUR_PHONE_NUMBER_ID/messages}
    api-token: ${WHATSAPP_API_TOKEN:your-whatsapp-api-token}

# Logging
quarkus:
  log:
    level: INFO
    category:
      "com.notificamy": DEBUG