# Database configuration - now using Secrets Manager
quarkus:
  datasource:
    db-kind: mysql
    # These will be dynamically configured via DatabaseConfigService
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    jdbc:
      url: ${DB_URL:}
      max-size: 16

  hibernate-orm:
    database:
      generation: none
    log:
      sql: ${QUARKUS_LOG_SQL:false}

  # Lambda configuration
  lambda:
    handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler

  # Disable dev services for production builds
  devservices:
    enabled: false

  # Package configuration for Lambda
  package:
    type: uber-jar

# Application configuration
app:
  # AWS Configuration
  aws:
    region: ${AWS_REGION:eu-south-1}
    secrets:
      database-secret-name: ${DATABASE_SECRET_NAME:notificamy/database-credentials}
      api-keys-secret-name: ${API_KEYS_SECRET_NAME:notificamy/api-keys}
    
    sqs:
      queue-url: ${AWS_SQS_QUEUE_URL:}
    ses:
      from-email: ${AWS_SES_FROM_EMAIL:service@notificamy.com}
      from-name: ${AWS_SES_FROM_NAME:Notificamy Service}
  
  # OpenAI Configuration - now from Secrets Manager
  openai:
    api-url: ${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
  
  # WhatsApp Configuration - now from Secrets Manager
  whatsapp:
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0/YOUR_PHONE_NUMBER_ID/messages}

# Logging
quarkus:
  log:
    level: INFO
    category:
      "com.notificamy": DEBUG