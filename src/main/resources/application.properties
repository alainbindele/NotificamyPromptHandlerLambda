quarkus.lambda.handler=io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-native-image:22.3-java17
quarkus.native.container-build=true
quarkus.native.additional-build-args=--enable-url-protocols=http,https

# Logging configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Database configuration
quarkus.hibernate-orm.enabled=true
quarkus.hibernate-orm.database.generation=none
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.credentials-provider=aws-secrets-manager
quarkus.datasource.credentials-provider-name=${DATABASE_SECRET_NAME}
quarkus.log.console.level=INFO
quarkus.hibernate-orm.log.sql=true
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20

# Disable HTTP port for Lambda
quarkus.http.port=-1

# AWS Configuration
quarkus.aws.region=${NOTIFICAMY_AWS_REGION}
quarkus.aws.credentials.type=default

# AWS Secrets Manager
quarkus.aws.secretsmanager.sync-client.type=url-connection

# WhatsApp Configuration
app.whatsapp.api-url=${WHATSAPP_API_URL}
app.whatsapp.api-token=${env.WHATSAPP_API_TOKEN:your_api_token_here}

# OpenAI Configuration - will be retrieved from AWS Secrets Manager
app.openai.api-key=${env.OPENAI_API_KEY:your_openai_api_key_here}
app.openai.api-url=https://api.openai.com/v1/chat/completions

# AWS SES Configuration
app.aws.ses.from-email=${AWS_SES_FROM_EMAIL}
app.aws.ses.from-name=Notificamy

# AWS SQS Configuration
app.aws.sqs.queue-url=${AWS_SQS_QUEUE_URL}

# AWS Secrets Manager Secret Names
app.aws.secrets.api-keys=${API_KEYS_SECRET_NAME}
app.aws.secrets.database=${DATABASE_SECRET_NAME}