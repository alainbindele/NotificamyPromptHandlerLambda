quarkus.lambda.handler=io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-native-image:22.3-java17
quarkus.native.container-build=true
quarkus.native.additional-build-args=--enable-url-protocols=http,https

# Database configuration
quarkus.hibernate-orm.enabled=true
quarkus.datasource.db-kind=mysql
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20

# Logging configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO

# Disable HTTP port for Lambda
quarkus.http.port=-1

# AWS Configuration - Use environment variables with fallbacks
quarkus.aws.region=${NOTIFICAMY_AWS_REGION:eu-south-1}
quarkus.aws.credentials.type=default

# Application configurations with environment variable fallbacks
app.whatsapp.api-url=${WHATSAPP_API_URL:https://api.whatsapp.com/v1/messages}
app.aws.ses.from-email=${AWS_SES_FROM_EMAIL:service@notificamy.com}
app.aws.sqs.queue-url=${AWS_SQS_QUEUE_URL:}
app.aws.region=${NOTIFICAMY_AWS_REGION:eu-south-1}

# AWS Secrets Manager Secret Names with fallbacks
app.aws.secrets.api-keys=${API_KEYS_SECRET_NAME:notificamy-api-keys}
app.aws.secrets.database=${DATABASE_SECRET_NAME:notificamy-database}

# Static configurations
app.openai.api-url=https://api.openai.com/v1/chat/completions
app.aws.ses.from-name=Notificamy

# Database connection will be configured dynamically from secrets
quarkus.datasource.jdbc.url=jdbc:mysql://15.160.48.145:3306/NotificamyDB
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}