quarkus.lambda.handler=io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-native-image:22.3-java17
quarkus.native.container-build=true
quarkus.native.additional-build-args=--enable-url-protocols=http,https
quarkus.hibernate-orm.enabled=false

# Logging configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Database configuration (if needed)
quarkus.hibernate-orm.database.generation=none
quarkus.datasource.db-kind=mysql
quarkus.log.console.level=INFO
quarkus.hibernate-orm.log.sql=true
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.http.port=-1
app.whatsapp.api-url=https://api.whatsapp.com/v1/messages
app.whatsapp.api-token=your_api_token_here
app.openai.api-key=your_openai_api_key_here
app.openai.api-url=https://api.openai.com/v1/chat/completions
app.aws.ses.from-email=service@notificamy.com
app.aws.ses.from-name=Notificamy


