# Quarkus Lambda Configuration
quarkus.lambda.handler=io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler

# Package as uber-jar for Lambda
quarkus.package.type=uber-jar

# Disable native compilation
quarkus.native.enabled=false

# Lambda runtime configuration
quarkus.lambda.mock-event-server.enabled=false

# Logging configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Database configuration (if needed)
quarkus.hibernate-orm.database.generation=none
quarkus.datasource.db-kind=mysql
quarkus.log.console.level=INFO
